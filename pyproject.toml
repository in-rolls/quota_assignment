[project]
name = "reservation-patterns"
version = "0.1.0"
description = "Geographic heterogeneity in women's reservation transitions"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<2.4",
    "pandas",
    "pyarrow",
    "scipy",
    "pymc>=5.20,<6",
    "arviz>=0.21,<0.23",
    "matplotlib",
    "h5netcdf",
    "h5py>=3.16.0",
]
[dependency-groups]
dev = ["pytest", "ruff"]
[project.scripts]
reservation-patterns = "reservation_patterns.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
